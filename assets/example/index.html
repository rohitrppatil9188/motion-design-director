<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFFSET — original motion-design example</title>
  <style>
    @font-face{font-family:Barlow Condensed;src:url('../fonts/BarlowCondensed-Black.ttf') format('truetype');font-weight:900;font-display:block}
    @font-face{font-family:Inter;src:url('../fonts/Inter-Variable.ttf') format('truetype');font-weight:100 900;font-display:block}
    *{box-sizing:border-box}html,body{margin:0;background:#17181a;color:#f4f1e9;font:14px Inter,sans-serif}
    main{min-height:100vh;display:grid;place-content:center;gap:16px;padding:24px}
    canvas{display:block;width:min(92vw,1280px);height:auto;aspect-ratio:16/9;background:#f4f1e9}
    footer{display:flex;align-items:center;gap:16px}button{background:#f4f1e9;border:0;color:#17181a;padding:10px 18px;font:600 13px Inter;cursor:pointer}input{flex:1}output{font-variant-numeric:tabular-nums}
    .render-mode main{padding:0;display:block;min-height:0}.render-mode canvas{width:100vw;height:100vh}.render-mode footer{display:none}
  </style>
</head>
<body><main><canvas id="film" width="1920" height="1080" aria-label="OFFSET: one small shift changes the field, an original fifteen-second motion study"></canvas><footer><button id="play">Play visuals</button><input id="scrub" aria-label="Time" type="range" min="0" max="14.983333" step="0.0166667" value="0"><output id="time">0.00 s</output><span>15 s · 60 fps · original code, geometry &amp; sound</span></footer></main><script type="module" src="film.mjs"></script></body>
</html>
